<div class="flex flex-col gap-4">
  <div class="flex justify-between items-center">
    <h1> إنتاج البيض </h1>
    <form [formGroup]="form" >
      <div class="lg:flex gap-2 items-center grid-cols-2">
        <div class="lg:w-[320px] w-[220px]">
          <app-dropdown
            [showLabel]="false"
            formControlName="cycleId"
            placeholder="اختر الدورة"
            [options]="cycleOptions"
            [isRequired]="false"
            (change)="getPage();searchMode = true"
            [showClear]="true"
          ></app-dropdown>
        </div>
        
        <div class="flex gap-3" *ngIf="pageResult.items?.length!>0">
          <button class="submitBtn" (click)="addNew()">إضافة</button>
        </div>
      </div>
    </form>

  </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة شئ بعد، سيظهر إنتاج البيض المضاف هنا... يمكنك البدء   "
      addButtonText="إضافة"
      nosearchBtnText="العودة إلى إنتاج البيض"
      [withAction]="false"
    ></app-list>
  </div>

  <app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="backToList()"
  [message]="successMesg"
  btnText="عرض إنتاج البيض"
></app-success-dialog>
