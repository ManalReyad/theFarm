<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <h1> مبيعات البيض </h1>
  
      <div class="flex gap-3" *ngIf="pageResult.items?.length!>0">
        <button class="submitBtn" (click)="addNew()">إضافة</button>
      </div>
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة شئ بعد، ستظهر مبيعات البيض المضافة هنا... يمكنك البدء   "
      addButtonText="إضافة"
      nosearchBtnText="العودة إلى القائمة"
      [withAction]="false"
      [specificAction]="role===1"
      specificActionLabel="تحديد السعر"
      (specificEvent)="openPriceForm($event)"
    ></app-list>
  </div>


  <p-dialog
  header=""
  [modal]="true"
  [(visible)]="showForm"
  [closable]="false"
  [style]="{ width: '25vw' }"
  [breakpoints]="{ '960px': '80vw' }"
>
  <div class="title">
    تحديد السعر
  </div>
  <form [formGroup]="form">
    <div class="grid grid-cols-12 mt-5">
      <div class="col-span-12">
        <app-input
          labelText="سعر الطبق"
          placeholder="أدخل سعر الطبق"
          formControlName="unitPrice"
          inputType="number"
        ></app-input>
      </div>
    </div>
  </form>

  <div class="flex justify-center gap-3 mt-5">
    <button class="submitBtn" (click)="savePrice()" [disabled]="form.invalid">
      {{ "حفظ" }}
    </button>
    <button class="exitBtn" (click)="showForm = false">إلغاء</button>
  </div>
</p-dialog>

  <app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="backToList()"
  [message]="successMesg"
  btnText="عرض مبيعات البيض"
></app-success-dialog>
