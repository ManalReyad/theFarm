<div class="flex flex-col gap-4">
  <div class="flex justify-between items-center">
    <h1>المخزن</h1>

    <div class="flex gap-3" *ngIf="pageResult.items?.length!>0">
      <button class="submitBtn" (click)="incoming()">توريد أصناف وأدوية</button>
    </div>
  </div>

  <app-list
    [listColumns]="columns"
    [pageResult]="pageResult"
    (pageChange)="onPageChanged($event)"
    [searchMode]="searchMode"
    noDataMessage="يبدو أنك لم تقم بتوريد أي أصناف أو أدوية  بعد، ستظهر الموارد المضافة هنا... يمكنك البدء "
    addButtonText="إضافة مزرعة"
    nosearchBtnText="العودة إلى المخزن"
    addButtonText="توريد أصناف وأدوية"
    (add)="incoming()"
    [withAction]="false"
    [hasPagination]="false"
  ></app-list>
</div>



<app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="showSuccessDialog = false"
  [message]="successMesg"
></app-success-dialog>
