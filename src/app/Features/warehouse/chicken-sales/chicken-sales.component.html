<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <h1> مبيعات الفراخ </h1>
  
      <div class="flex gap-3" *ngIf="pageResult.items?.length!>0">
        <button class="submitBtn" (click)="addNew()">إضافة</button>
      </div>
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة شئ بعد، ستظهر مبيعات الفراخ المضافة هنا... يمكنك البدء   "
      addButtonText="إضافة"
      nosearchBtnText="العودة إلى القائمة"
      [hasPagination]="false"
      [withAction]="false"
    ></app-list>
  </div>

  <app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="backToList()"
  [message]="successMesg"
  btnText="عرض مبيعات الفراخ"
></app-success-dialog>
