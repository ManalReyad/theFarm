<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <h1>الموظفين</h1>
  
      <div class="flex gap-3" *ngIf="pageResult.items?.length! > 0">
        <button class="submitBtn" (click)="addNew()">إضافة موظف</button>
      </div>
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة أي موظف بعد، ستظهر الموظفين المضافة هنا... يمكنك البدء بإضافة أول موظف"
      addButtonText="إضافة موظف"
      nosearchBtnText="العودة إلى الموظفين"
      [hasPagination]="false"
      [withAction]="false"
      [withCustomAction]="true"
      [customActionMenu]="customActionMenu"
      
    ></app-list>
  </div>
  
  <app-confirmation-delete-dialog
    message="هل أنت متأكد أنك تريد حذف الموظف؟ سيتم حذفه نهائيًا من قائمة الموظفين"
    [visible]="showConfirmDeleteDialog"
    (onSubmitEvent)="submitDelete()"
    (exit)="close()"
  ></app-confirmation-delete-dialog>
  
  <app-success-dialog
    [visible]="showSuccessDialog"
    (onSubmitEvent)="backToList()"
    [message]="successMesg"
    btnText="عرض الموظفين"
  ></app-success-dialog>
