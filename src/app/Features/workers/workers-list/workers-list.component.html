<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <h1>الموظفين</h1>
  
      <div class="flex gap-3" *ngIf="pageResult.items?.length! > 0">
        <button class="submitBtn" (click)="addNew()">إضافة موظف</button>
      </div>
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة أي موظف بعد، ستظهر الموظفين المضافة هنا... يمكنك البدء بإضافة أول موظف"
      addButtonText="إضافة موظف"
      nosearchBtnText="العودة إلى الموظفين"
      [hasPagination]="false"
      [withAction]="false"
      [withCustomAction]="true"
      [customActionMenu]="customActionMenu"
      
    ></app-list>
  </div>
  



  <p-dialog
  header=""
  [modal]="true"
  [(visible)]="showForm"
  [closable]="false"
  [style]="{ width: '25vw' }"
  [breakpoints]="{ '960px': '80vw' }"
  [focusOnShow]="false"
>
  <div class="title">
   صرف الراتب
  </div>
  <form [formGroup]="form">
    <div class="grid grid-cols-12 mt-5">
      <div class="col-span-12">
        <app-input
          labelText="الشهر"
          placeholder="ادخل الشهر"
          formControlName="month"
          inputType="number"
        ></app-input>
      </div>
      <div class="col-span-12">
        <app-input
          labelText="السنة"
          placeholder="ادخل السنة"
          formControlName="year"
          inputType="number"
        ></app-input>
      </div>
    </div>
  </form>

  <div class="flex justify-center gap-3 mt-5">
    <button class="submitBtn" (click)="saveSalary()" [disabled]="form.invalid">
      {{ editMode ? "حفظ" : "إضافة" }}
    </button>
    <button class="exitBtn" (click)="showForm = false">إلغاء</button>
  </div>
</p-dialog>



  <app-confirmation-delete-dialog
    message="هل أنت متأكد أنك تريد حذف الموظف؟ سيتم حذفه نهائيًا من قائمة الموظفين"
    [visible]="showConfirmDeleteDialog"
    (onSubmitEvent)="submitDelete()"
    (exit)="close()"
  ></app-confirmation-delete-dialog>
  
  <app-success-dialog
    [visible]="showSuccessDialog"
    (onSubmitEvent)="backToList()"
    [message]="successMesg"
    btnText="عرض الموظفين"
  ></app-success-dialog>
