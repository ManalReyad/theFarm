<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <h1>الموردين</h1>
  
      <div class="flex gap-3" *ngIf="pageResult.items?.length! > 0">
        <button class="submitBtn" (click)="addNew()">إضافة مورد</button>
      </div>
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة أي مورد بعد، ستظهر الموردين المضافة هنا... يمكنك البدء بإضافة أول مورد"
      addButtonText="إضافة مورد"
      nosearchBtnText="العودة إلى الموردين"
      [hasPagination]="false"
    ></app-list>
  </div>
  
  <app-confirmation-delete-dialog
    message="هل أنت متأكد أنك تريد حذف المورد؟ سيتم حذفه نهائيًا من قائمة الموردين"
    [visible]="showConfirmDeleteDialog"
    (onSubmitEvent)="submitDelete()"
    (exit)="close()"
  ></app-confirmation-delete-dialog>
  
  <app-success-dialog
    [visible]="showSuccessDialog"
    (onSubmitEvent)="backToList()"
    [message]="successMesg"
    btnText="عرض الموردين"
  ></app-success-dialog>
