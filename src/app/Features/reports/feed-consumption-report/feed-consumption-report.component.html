<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
        <h1>تقرير استهلاك العلف</h1>
        <form [formGroup]="form">
        <div class="lg:flex gap-2 items-center grid-cols-2">
                  <div class="flex gap-3" *ngIf="pageResult.items?.length! > 0">
      <button class="submitBtn gap-2" (click)="downloadReport()" [disabled]="loading">تحميل التقرير 
        <i *ngIf="!loading" class="pi pi-download"></i>
        <i *ngIf="loading" class="pi pi-spin pi-spinner-dotted" style="font-size: .9rem"></i>
      </button>
    </div>
          <div class="lg:w-[320px] w-[220px]">
            <app-dropdown
              [showLabel]="false"
              formControlName="cycleId"
              placeholder="اختر الدورة"
              [options]="cycleOptions"
              [isRequired]="false"
              (change)="getPage();searchMode = true"
            ></app-dropdown>
          </div>
        </div>
      </form>
  
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="no-data.svg"
      noDataMessage="لا يوجد بيانات"
      [withAction]="false"
    ></app-list>
  </div>
