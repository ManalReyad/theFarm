<h1>تسجيل بيانات العنبر</h1>
<app-bread-crumb
  [pages]="pages"
></app-bread-crumb>

<form [formGroup]="form" class="card">
  <div class="grid grid-cols-12 gap-3">
    <div class="2xl:col-span-4 xl:col-span-4 lg:col-span-6 col-span-12">
      <app-input
        labelText="اسم العنبر"
        placeholder="أدخل اسم العنبر"
        formControlName="name"
      ></app-input>
    </div>
    <div class="2xl:col-span-4 xl:col-span-4 lg:col-span-6 col-span-12">
      <app-dropdown
        labelText="المزرعة"
        formControlName="farmID"
        [options]="farmOptions"
        placeholder="اختر المزرعة"
      >
      </app-dropdown>
    </div>
    <div class="2xl:col-span-4 xl:col-span-4 lg:col-span-6 col-span-12">
      <app-dropdown
        labelText="نوع العنبر"
        formControlName="roomTypeID"
        [options]="roomTypeOptions"
        placeholder="اختر نوع العنبر"
      >
      </app-dropdown>
    </div>
  </div>

  <div class="flex justify-end gap-4 mt-5">
    <button class="submitBtn" (click)="save()" [disabled]="form.invalid">
      {{ editMode ? "حفظ" : "إضافة" }}
    </button>
    <button class="exitBtn" (click)="backToList()">إلغاء</button>
  </div>
</form>

<app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="backToList()"
  [message]="successMesg"
  btnText="عرض العنابر"
></app-success-dialog>
