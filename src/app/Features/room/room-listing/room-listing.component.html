<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <h1> العنابر </h1>
  
      <div class="flex gap-3" *ngIf="pageResult.items?.length!>0">
        <button class="submitBtn" (click)="addNew()">إضافة عنبر</button>
      </div>
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة أي عنبر بعد، ستظهر العنابر المضافة هنا... يمكنك البدء بإضافة أول عنبر "
      addButtonText="إضافة عنبر"
      nosearchBtnText="العودة إلى العنابر"
      [withCustomAction]="true"
      [withAction]="false"
      (assetClicked)="goToRoomAssets($event)"
    ></app-list>
  </div>
  <p-dialog
  header=""
  [modal]="true"
  [(visible)]="showForm"
  [closable]="false"
  [style]="{ width: '25vw' }"
  [breakpoints]="{ '960px': '80vw' }"
>
  <div class="title">
    {{ editMode ? "تعديل العنبر" : "إضافة عنبر" }}
  </div>
  <form [formGroup]="form" class="card">
    <div class="grid grid-cols-12 gap-3">
      <div class="col-span-12">
        <app-input
          labelText="اسم العنبر"
          placeholder="أدخل اسم العنبر"
          formControlName="name"
        ></app-input>
      </div>
      <div class="col-span-12">
        <app-dropdown
          labelText="نوع العنبر"
          formControlName="roomTypeID"
          [options]="roomTypeOptions"
          placeholder="اختر نوع العنبر"
        >
        </app-dropdown>
      </div>
    </div>
  </form>

  <div class="flex justify-center gap-3 mt-5">
    <button class="submitBtn" (click)="save()" [disabled]="form.invalid">
      {{ editMode ? "حفظ" : "إضافة" }}
    </button>
    <button class="exitBtn" (click)="showForm=false">إلغاء</button>
  </div>
</p-dialog>






    <app-confirmation-delete-dialog
    message="هل أنت متأكد أنك تريد حذف العنبر؟ سيتم حذفه نهائيًا من قائمة العنابر"
    [visible]="showConfirmDeleteDialog"
    (onSubmitEvent)="submitDelete()"
    (exit)="close()"
  ></app-confirmation-delete-dialog>

  <app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="backToList()"
  [message]="successMesg"
  btnText="عرض العنابر"
></app-success-dialog>
