<div class="flex flex-col gap-4">
  <h1>حساب العميل</h1>
   <div class="flex justify-between items-center">
       <app-bread-crumb  [pages]="pages"></app-bread-crumb>
  
      <div class="flex gap-3">
        <button class="submitBtn" (click)="addNew()">دفع لحساب مورد</button>
      </div>
    </div>
  <!-- بيانات المورد -->
  <div
    class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm"
    *ngIf="data"
  >
    <div class="flex flex-col">
      <span class="text-gray-500 text-sm">اسم العميل</span>
      <span class="text-lg font-semibold">
        {{ data.traderName }}
      </span>
    </div>

    <div class="flex flex-col items-end">
      <span class="text-gray-500 text-sm">التراكمي المتبقي</span>
      <span class="text-lg font-semibold">
        {{ data.currentBalance }}
      </span>
    </div>
  </div>

  <!-- جدول الحساب -->
  <app-list
    [listColumns]="columns"
    [pageResult]="pageResult"
    (pageChange)="onPageChanged($event)"
    [searchMode]="searchMode"
    (back)="resetSearch()"
    noDataImg="nodepartments.svg"
    noDataMessage="لا يوجد حساب لهذا العميل بعد"
    nosearchBtnText="العودة إلى العملاء"
    [withAction]="false"
  ></app-list>

</div>


<p-dialog
  header=""
  [modal]="true"
  [(visible)]="showForm"
  [closable]="false"
  [style]="{ width: '25vw' }"
  [breakpoints]="{ '960px': '80vw' }"
>
  <div class="title">
    {{ editMode ? "تعديل حساب" : "إضافة حساب" }}
  </div>
  <form [formGroup]="form">
    <div class="grid grid-cols-12 mt-5">
      <div class="col-span-12">
        <app-dropdown
          labelText="المخزن"
          placeholder="أدخل المخزن"
          formControlName="warehouseId"
          [options]="warehouseOptions"
        ></app-dropdown>
      </div>
      <div class="col-span-12">
        <app-input
          labelText="المبلغ"
          placeholder="أدخل المبلغ"
          formControlName="amount"
          inputType="number"
        ></app-input>
      </div>
      <div class="col-span-12">
        <app-date-input
          labelText="التاريخ"
          placeholder="أدخل التاريخ"
          formControlName="date"
        ></app-date-input>
      </div>
      <div class="col-span-12 flex flex-col mt-4">
        <label>الوصف</label>
        <textarea
          placeholder="ادخل الوصف"
          cols="12"
          rows="3"
          formControlName="notes"
        ></textarea>
      </div>
    </div>
  </form>

  <div class="flex justify-center gap-3 mt-5">
    <button class="submitBtn" (click)="save()" [disabled]="form.invalid">
      {{ editMode ? "حفظ" : "إضافة" }}
    </button>
    <button class="exitBtn" (click)="showForm=false">إلغاء</button>
  </div>
</p-dialog>


<app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="backToList()"
  [message]="successMesg"
  btnText="عرض الحساب"
></app-success-dialog>
