<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <h1>العملاء</h1>
  
      <div class="flex gap-3" *ngIf="pageResult.items?.length! > 0">
        <button class="submitBtn" (click)="addNew()">إضافة عميل</button>
      </div>
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة أي عميل بعد، ستظهر العملاء المضافة هنا... يمكنك البدء بإضافة أول عميل"
      addButtonText="إضافة عميل"
      nosearchBtnText="العودة إلى العملاء"
      [withAction]="false"
      [withCustomAction]="true"
      [customActionMenu]="customActionMenu"
    ></app-list>
  </div>
  
  <app-confirmation-delete-dialog
    message="هل أنت متأكد أنك تريد حذف العميل؟ سيتم حذفه نهائيًا من قائمة العملاء"
    [visible]="showConfirmDeleteDialog"
    (onSubmitEvent)="submitDelete()"
    (exit)="close()"
  ></app-confirmation-delete-dialog>
  
  <app-success-dialog
    [visible]="showSuccessDialog"
    (onSubmitEvent)="backToList()"
    [message]="successMesg"
    btnText="عرض العملاء"
  ></app-success-dialog>
