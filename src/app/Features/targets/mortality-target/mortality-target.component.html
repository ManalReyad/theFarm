<div class="flex flex-col gap-4">
        <div class="flex justify-between items-center">
            <h1>تسجيل مستهدف النافق</h1>

            <form [formGroup]="form" class="flex gap-3">
              <div class="lg:flex gap-2 items-center  grid-cols-2">
                <div class="lg:w-[280px] w-[220px]">
                  <app-dropdown
                    [showLabel]="false"
                    formControlName="breedId"
                    placeholder="اختر السلالة"
                    [options]="breedsOptions"
                    [isRequired]="false"
                    (change)="getPage();searchMode = true"
                    [showClear]="true"
                  ></app-dropdown>
                </div>
                
               
              </div>
              <div class="flex items-center gap-3" *ngIf="pageResult.items?.length! > 0">
                <button class="submitBtn" (click)="addNew()">
                  إضافة مستهدف نافق
                </button>
              </div>
      
            </form>
        
      
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nofeedmix.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة أي مستهدف نافق بعد، ستظهر الخلطات هنا... يمكنك البدء بإضافة أول مستهدف نافق"
      addButtonText="إضافة مستهدف نافق"
      nosearchBtnText="العودة إلى مستهدف النافق"
      [withAction]="false"
    ></app-list>
  </div>

    message="هل أنت متأكد أنك تريد حذف خلطة العلف؟ سيتم حذفها نهائيًا من قائمة مستهدف النافق"
    [visible]="showConfirmDeleteDialog"
    (onSubmitEvent)="submitDelete()"
    (exit)="close()"
  ></app-confirmation-delete-dialog> -->
  
  <app-success-dialog
    [visible]="showSuccessDialog"
    (onSubmitEvent)="backToList()"
    [message]="successMesg"
    btnText="عرض مستهدف النافق"
  ></app-success-dialog>
