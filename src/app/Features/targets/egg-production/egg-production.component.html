<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
        <h1>تسجيل مستهدف إنتاج البيض</h1>

        <form [formGroup]="form" class="flex gap-3">
          <div class="lg:flex gap-2 items-center  grid-cols-2">
            <div class="lg:w-[280px] w-[220px]">
              <app-dropdown
                [showLabel]="false"
                formControlName="breedId"
                placeholder="اختر السلالة"
                [options]="breedsOptions"
                [isRequired]="false"
                (change)="getPage();searchMode = true"
              ></app-dropdown>
            </div>
            
           
          </div>
          <div class="flex items-center gap-3" *ngIf="pageResult.items?.length! > 0">
            <button class="submitBtn" (click)="addNew()">
              إضافة مستهدف إنتاج بيض
            </button>
          </div>
  
        </form>
    
  
</div>

<app-list
  [listColumns]="columns"
  [pageResult]="pageResult"
  (pageChange)="onPageChanged($event)"
  (edit)="edit($event)"
  (delete)="delete($event)"
  (add)="addNew()"
  [searchMode]="searchMode"
  (back)="resetSearch()"
  noDataImg="nofeedmix.svg"
  noDataMessage="يبدو أنك لم تقم بإضافة أي مستهدف إنتاج بيض بعد، سيظهر مستهدف إنتاج البيض هنا... يمكنك البدء بإضافة أول مستهدف إنتاج بيض"
  addButtonText="إضافة مستهدف إنتاج بيض"
  nosearchBtnText="العودة إلى مستهدف إنتاج البيض"
  [withAction]="false"
></app-list>
</div>
