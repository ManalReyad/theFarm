<h1>تسجيل تقييمات الدورة</h1>
<app-bread-crumb [pages]="pages"></app-bread-crumb>

<form [formGroup]="form" class="card">
  <div class="grid grid-cols-12 gap-3">
    <div class="lg:col-span-6 col-span-12">
      <app-dropdown
        [options]="cycleOptions"
        formControlName="cycleId"
        labelText="اسم الدورة"
        [disabled]="true"
      ></app-dropdown>
    </div>
    <div class="lg:col-span-8 col-span-12">
      <p-table
        [value]="[
          {
            property1: 'Value 1A',
            property2: 'Value 1B',
            property3: 'Value 1C'
          }
        ]"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>#</th>
            <th>بند التقييم</th>
            <th>الدرجة</th>
            <th></th>
          </tr>
        </ng-template>

        <ng-template
          pTemplate="body"
          let-row
          let-i="index"
          formArrayName="scores"
        >
          <tr
            [formGroupName]="i"
            *ngFor="let target of Scores.controls; let i = index"
          >
            <td>{{ i + 1 }}</td>

            <td>
              <app-dropdown
                [options]="getAvailableEvaluationItems(i)"
                placeholder="اختر بند التقييم"
                formControlName="evaluationItemId"
                [showLabel]="false"
                [isRequired]="false"
              ></app-dropdown>
            </td>
            <td>
              <app-input
                type="number"
                placeholder="الدرجة"
                formControlName="score"
                (keydown)="restrictNagtive($event)"
                [showLabel]="false"
                [isRequired]="false"
              ></app-input>
            </td>

            <!-- أزرار إضافة/حذف -->
            <td>
              <button (click)="deleteScoreRow(i)" class="add">
                <i class="pi pi-minus"></i>
              </button>
              <button
                (click)="addScoreRow()"
                class="add flex items-center"
                [disabled]="
                  isCurrentScoreRowInvalid() ||
                  Scores.length >= evaluationItemsOptions.length
                "
              >
                <i class="pi pi-plus"></i>
              </button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>


  <div class="flex justify-end gap-4 mt-5">
    <button class="submitBtn" (click)="save()" [disabled]="form.invalid||Scores.length<1">
      {{ editMode ? "حفظ" : "إضافة" }}
    </button>
    <button class="exitBtn" (click)="backToList()">إلغاء</button>
  </div>
</form>
