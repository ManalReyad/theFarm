<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <h1> التقييمات </h1>
  
      <div class="flex gap-3" *ngIf="pageResult.items?.length!>0">
        <button class="submitBtn" (click)="addNew()">إضافة تقييم</button>
      </div>
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (delete)="delete($event)"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      (add)="addNew()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة أي تقييم بعد، ستظهر التقييمات المضافة هنا... يمكنك البدء بإضافة أول تقييم "
      addButtonText="إضافة تقييم"
      nosearchBtnText="العودة إلى التقييمات"
      [withAction]="false"
    ></app-list>
  </div>

    <app-confirmation-delete-dialog
    message="هل أنت متأكد أنك تريد حذف التقييم؟ سيتم حذفها نهائيًا من قائمة التقييمات"
    [visible]="showConfirmDeleteDialog"
    (onSubmitEvent)="submitDelete()"
    (exit)="close()"
  ></app-confirmation-delete-dialog>

  <app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="backToList()"
  [message]="successMesg"
  btnText="عرض التقييمات"
></app-success-dialog>
