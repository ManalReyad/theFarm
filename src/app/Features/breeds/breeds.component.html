<div class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <h1>السلالات</h1>
  
      <div class="flex gap-3" *ngIf="pageResult.items?.length! > 0">
        <button class="submitBtn" (click)="addNew()">إضافة سلالة</button>
      </div>
    </div>
  
    <app-list
      [listColumns]="columns"
      [pageResult]="pageResult"
      (pageChange)="onPageChanged($event)"
      (edit)="edit($event)"
      (delete)="delete($event)"
      (add)="addNew()"
      [searchMode]="searchMode"
      (back)="resetSearch()"
      noDataImg="nodepartments.svg"
      noDataMessage="يبدو أنك لم تقم بإضافة أي سلالة بعد، ستظهر السلالة المضافة هنا... يمكنك البدء بإضافة أول سلالة "
      addButtonText="إضافة سلالة"
      nosearchBtnText="العودة إلى السلالة"
      [withAction]="false"
    ></app-list>
  </div>
  
  <p-dialog
    header=""
    [modal]="true"
    [(visible)]="showForm"
    [closable]="false"
    [style]="{ width: '25vw' }"
    [breakpoints]="{ '960px': '80vw' }"
  >
    <div class="title">
      {{ editMode ? "تعديل السلالة" : "إضافة سلالة" }}
    </div>
    <form [formGroup]="form">
      <div class="grid grid-cols-12 mt-5">
        <div class="col-span-12">
          <app-input
            labelText="اسم السلالة"
            placeholder="أدخل اسم السلالة"
            formControlName="name"
          ></app-input>
        </div>
      </div>
    </form>
  
    <div class="flex justify-center gap-3 mt-5">
      <button class="submitBtn" (click)="save()" [disabled]="form.invalid">
        {{ editMode ? "حفظ" : "إضافة" }}
      </button>
      <button class="exitBtn" (click)="showForm=false">إلغاء</button>
    </div>
  </p-dialog>
  
  <!-- <app-confirmation-delete-dialog
    message="هل أنت متأكد أنك تريد حذف السلالة؟ سيتم حذفها نهائيًا من قائمة السلالات"
    [visible]="showConfirmDeleteDialog"
    (onSubmitEvent)="submitDelete()"
    (exit)="close()"
  ></app-confirmation-delete-dialog> -->
  
  <app-success-dialog
    [visible]="showSuccessDialog"
    (onSubmitEvent)="backToList()"
    [message]="successMesg"
    btnText="عرض السلالات"
  ></app-success-dialog>
  
  <app-confirmation-dialog
    [visible]="showWarnningDialog"
    (onSubmitEvent)="close()"
    (exit)="back()"
  >
  </app-confirmation-dialog>
