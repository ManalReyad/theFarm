<div class="flex flex-col gap-4">
  <div class="flex justify-between items-center">
    <h1>مخزن الأصول</h1>

    <div class="flex gap-3" *ngIf="pageResult.items?.length! > 0">
      <button class="submitBtn" (click)="addNew()">إضافة أصل للمخزن</button>
    </div>
  </div>

  <app-list
    [listColumns]="columns"
    [pageResult]="pageResult"
    (pageChange)="onPageChanged($event)"
    (edit)="edit($event)"
    (delete)="delete($event)"
    (add)="warehouseAsset?.id ? addNew() : (showAddWarehouseForm = true)"
    [searchMode]="searchMode"
    (back)="resetSearch()"
    noDataImg="nodepartments.svg"
    [noDataMessage]="
      warehouseAsset
        ? 'يبدو أنك لم تقم بإضافة أي أصل ' +'إلى '+
         '('+ warehouseAsset?.name+')' +' '+
          'ستظهر الأصول المضافة هنا... يمكنك البدء بإضافة أول أصل'
        : 'يبدو أنك لم تقم بإضافة مخزن أصول بعد، يمكنك البدء بإضافة مخزن أصول'
    "
    [addButtonText]="warehouseAsset?.id ? 'إضافة أصل' : 'إضافة مخزن أصل'"
    nosearchBtnText="العودة إلى الأصول"
    [hasPagination]="false"
    [withAction]="false"
    
  ></app-list>
</div>

<p-dialog
  header=""
  [modal]="true"
  [(visible)]="showAddWarehouseForm"
  [closable]="false"
  [style]="{ width: '25vw' }"
  [breakpoints]="{ '960px': '80vw' }"
>
  <div class="title">إضافة مخزن أصل</div>
  <form [formGroup]="warehouseForm">
    <div class="grid grid-cols-12 mt-5">
      <div class="col-span-12">
        <app-input
          labelText="اسم مخزن أصل"
          placeholder="أدخل مخزن اسم الأصل"
          formControlName="name"
        ></app-input>
      </div>
    </div>
  </form>

  <div class="flex justify-center gap-3 mt-5">
    <button
      class="submitBtn"
      (click)="saveWarehoseAsset()"
      [disabled]="warehouseForm.invalid"
    >
      {{ editMode ? "حفظ" : "إضافة" }}
    </button>
    <button class="exitBtn" (click)="showAddWarehouseForm = false">إلغاء</button>
  </div>
</p-dialog>
<p-dialog
  header=""
  [modal]="true"
  [(visible)]="showForm"
  [closable]="false"
  [style]="{ width: '25vw' }"
  [breakpoints]="{ '960px': '80vw' }"
>
  <div class="title">
    {{ editMode ? "تعديل الأصل" : "إضافة أصل" }}
  </div>
  <form [formGroup]="form">
    <div class="grid grid-cols-12 mt-5">
      <div class="col-span-12">
        <app-dropdown
          labelText="اسم المخزن"
          placeholder="أدخل مخزن الأصل"
          formControlName="assetWarehouseId"
          [options]="[{id:warehouseAsset?.id,name:warehouseAsset?.name}]"
          [disabled]="true"
        ></app-dropdown>
      </div>
            <div class="col-span-12">
        <app-dropdown
          labelText="اسم الأصل"
          placeholder="أدخل اسم الأصل"
          formControlName="assetItemId"
          [options]="assetItemsOptions"
        ></app-dropdown>
      </div>
      <div class="col-span-12">
        <app-input
          labelText="العدد"
          placeholder="أدخل عدد الأصل"
          formControlName="quantity"
        ></app-input>
      </div>
          <div class="col-span-12">
        <app-input
          labelText="سعر الوحدة"
          placeholder="أدخل سعر الوحدة"
          formControlName="unitPrice"
        ></app-input>
      </div>
    </div>
  </form>

  <div class="flex justify-center gap-3 mt-5">
    <button class="submitBtn" (click)="save()" [disabled]="form.invalid">
      {{ editMode ? "حفظ" : "إضافة" }}
    </button>
    <button class="exitBtn" (click)="showForm = false">إلغاء</button>
  </div>
</p-dialog>

<app-confirmation-delete-dialog
  message="هل أنت متأكد أنك تريد حذف الأصل؟ سيتم حذفه نهائيًا من قائمة الأصول"
  [visible]="showConfirmDeleteDialog"
  (onSubmitEvent)="submitDelete()"
  (exit)="close()"
></app-confirmation-delete-dialog>

<app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="backToList()"
  [message]="successMesg"
  [btnText]="warehouseAsset?.id?'حسناً':'عرض الأصول'"
></app-success-dialog>

<app-confirmation-dialog
  [visible]="showWarnningDialog"
  (onSubmitEvent)="close()"
  (exit)="back()"
>
</app-confirmation-dialog>
