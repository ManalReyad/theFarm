<div class="flex flex-col gap-4">
  <div class="flex justify-between items-center">
    <h1>التسجيلات اليومية</h1>
    <form [formGroup]="form" *ngIf="pageResult.items?.length! > 0">
      <div class="lg:flex gap-2 items-center grid-cols-2">
        <div class="lg:w-[320px] w-[220px]">
          <app-dropdown
            [showLabel]="false"
            formControlName="cycleId"
            placeholder="اختر الدورة"
            [options]="cycleOptions"
            [isRequired]="false"
            (change)="getPage();searchMode = true"
            [showClear]="true"
          ></app-dropdown>
        </div>
        
    <div class="flex gap-3" >
      <button class="submitBtn" (click)="addNew()">إضافة تسجيل يومي</button>
    </div>
      </div>
    </form>

  </div>

  <app-list
    [listColumns]="columns"
    [pageResult]="pageResult"
    (pageChange)="onPageChanged($event)"
    (edit)="edit($event)"
    (delete)="delete($event)"
    [hasEdit]="false"
    (add)="addNew()"
    [searchMode]="searchMode"
    (back)="resetSearch()"
    noDataImg="nodepartments.svg"
    noDataMessage="يبدو أنك لم تقم بإضافة أي تسجيل يومي بعد، ستظهر التسجيلات اليومية المضافة هنا... يمكنك البدء بإضافة أول تسجيل يومي "
    addButtonText="إضافة تسجيل يومي"
    nosearchBtnText="العودة إلى التسجيلات اليومية"
  ></app-list>
</div>

<app-confirmation-delete-dialog
  message="هل أنت متأكد أنك تريد حذف التسجيل يومي؟ سيتم حذفها نهائيًا من قائمة التسجيلات اليومية"
  [visible]="showConfirmDeleteDialog"
  (onSubmitEvent)="submitDelete()"
  (exit)="close()"
></app-confirmation-delete-dialog>

<app-success-dialog
  [visible]="showSuccessDialog"
  (onSubmitEvent)="backToList()"
  [message]="successMesg"
  btnText="عرض التسجيلات اليومية"
></app-success-dialog>
